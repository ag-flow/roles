name: build-app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - { name: "backend-roles", context: "backend", dockerfile: "Dockerfile" }
          - { name: "frontend-role", context: "frontend", dockerfile: "Dockerfile" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          OWNER_LC="${IMAGE_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER_LC}/${{ matrix.component.name }}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.context }}/${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
