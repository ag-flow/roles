[project]
name = "agflow-scraper-youtube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.0",
    "minio>=7.2",
    "pydantic>=2.5",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
