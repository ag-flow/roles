# Analyse SonarCloud — déclenchée à chaque push (analyse automatique).
#
# sonar.projectKey et sonar.organization ne sont PAS renseignés ici : ils
# viennent de la liaison du dépôt dans SonarCloud. À ajouter uniquement si
# l'analyse passe un jour par le scanner CLI au lieu de l'analyse automatique.

sonar.sources=backend/src,frontend/src,docker
sonar.tests=backend/tests,frontend/src/__tests__

# Python 3.12 (requires-python du backend). Déclarer la version évite que
# l'analyseur applique les règles d'une autre version du langage.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Le sous-paquet `secrets` est le paquet harpocrate embarqué (éditable, exclu
# du wheel) : il porte ses propres tests et n'est pas du code de ce dépôt.
sonar.exclusions=backend/src/role_builder/secrets/**,**/node_modules/**,frontend/.next/**
# L'exclusion des tests se déclare séparément de celle des sources, et les
# chemins sont relatifs à la racine du dépôt — une exclusion mal ancrée
# n'exclut rien et personne ne le remarque.
sonar.test.exclusions=backend/tests/**,frontend/src/__tests__/**

# La branche surveillée NE se déclare PAS ici : sonar.branch.name est fourni par
# l'analyse, et le figer ferait remonter toutes les branches sous le même nom.
# Le projet doit avoir `dev` comme branche principale dans SonarCloud
# (Administration → Branches) — surveiller une branche inutilisée ne déclenche
# jamais rien, et l'absence de résultat se confond avec l'absence de problème.
