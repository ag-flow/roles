[project]
name = "role-builder-backend"
version = "0.8.1"
description = "Role Builder backend (FastAPI + asyncpg)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "minio>=7.2",
    "httpx>=0.26",
    "python-multipart>=0.0.6",
    "pyjwt[crypto]>=2.8",
    "apscheduler>=3.10.4",
    "mcp>=1.28.0",
    "harpocrate>=0.1.0",
    "cryptography>=42",
    "argon2-cffi>=23",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Produit coverage.xml AVANT l'analyse statique : sans ce rapport, la
    # couverture est lue à zéro et la quality gate échoue sans que le code y
    # soit pour quelque chose.
    "pytest-cov>=5.0",
    "ruff>=0.2",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harpocrate = { path = "src/role_builder/secrets", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/role_builder"]
exclude = ["src/role_builder/secrets"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]  # géré par formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic Depends/Query/Path/Body/Header/Cookie/Form are call-defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Le rapport de couverture est produit par pytest lui-même, pas par une étape
# de CI. Raison : SonarCloud lit la couverture à ZÉRO si coverage.xml n'existe
# pas au chemin déclaré dans sonar-project.properties, et la quality gate
# échoue alors sans rapport avec la qualité du code. Le mettre ici plutôt que
# dans .github/workflows/ garantit qu'un nouveau job de CI ne puisse pas
# l'oublier — c'est la commande `pytest` qui porte la garantie, pas sa
# configuration d'appel.
# Chemin relatif à backend/ : ../coverage.xml = racine du dépôt, ce que
# sonar.python.coverage.reportPaths attend. coverage.xml est gitignoré.
addopts = "--cov=src --cov-report=xml:../coverage.xml --cov-report=term-missing"
