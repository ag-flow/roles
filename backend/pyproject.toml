[project]
name = "role-builder-backend"
version = "0.8.1"
description = "Role Builder backend (FastAPI + asyncpg)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "minio>=7.2",
    "httpx>=0.26",
    "python-multipart>=0.0.6",
    "pyjwt[crypto]>=2.8",
    "apscheduler>=3.10.4",
    "harpocrate>=0.1.0",
    "cryptography>=42",
    "argon2-cffi>=23",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harpocrate = { path = "src/role_builder/secrets", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/role_builder"]
exclude = ["src/role_builder/secrets"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]  # géré par formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic Depends/Query/Path/Body/Header/Cookie/Form are call-defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
